<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Mamataz Global - Daily Income & Expense</title>
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css" integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">
    <!-- jQuery, jsPDF, and html2canvas -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-light">

    <div class="container py-4">
        <!-- Header Card -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h4 font-weight-bold text-dark mb-1">AL Mamataz Global</h2>
                <p class="text-muted mb-3">Daily Income & Expense Calculator (<span class="current-date"></span>)</p>
                
                <!-- Action Buttons Toolbar -->
                <div class="d-flex flex-wrap gap-2">
                    <button type="button" class="btn btn-success btn-sm btn-add-srvice mb-2 mr-2">
                        <i class="fa fa-plus"></i> Add Plus
                    </button>
                    <button type="button" class="btn btn-danger btn-sm btn-minus-srvice mb-2 mr-2">
                        <i class="fa fa-minus"></i> Add Minus
                    </button>
                    <button type="button" class="btn btn-dark btn-sm equal mb-2 mr-2">
                        <i class="fa fa-calculator"></i> Calculate
                    </button>
                    <button class="btn btn-info btn-sm save mb-2 mr-2" onclick="generatePdf()">
                        <i class="fa fa-file-pdf"></i> Save PDF
                    </button>
                    <!-- Reset / Clear All Button -->
                    <button type="button" class="btn btn-outline-danger btn-sm btn-reset mb-2">
                        <i class="fa fa-trash"></i> Reset All
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Form Content Area for PDF Output -->
        <div class="card shadow-sm">
            <div class="card-body">
                <form>
                    <div id="attributes_area">
                      <div class="row border-bottom pb-3 mb-4 mx-0 align-items-center">
                          <div class="col-8 px-0">
                              <h3 class="h5 m-0 text-secondary">Summary Sheet</h3>
                          </div>
                          <div class="col-3 px-0 text-right">
                              <strong>Date:</strong> <span class="current-date"></span>
                          </div>
                      </div>
                      <div class="p-3 bg-white rounded border mb-3">
                          <h4 class="h5 font-weight-bold text-primary m-0">Total = <span id="total">0</span></h4>
                      </div>
                      <!-- Dynamic rows will be inserted here -->
                  </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Script File -->
    <script src="script.js" type="text/javascript"></script>
</body>
</html>
